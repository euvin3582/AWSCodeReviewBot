name: Bedrock Code Review

# Dogfooding: this repo reviews its own PRs with the action it ships,
# the same way every other repo in dogvatar-dog does. Pinned to @v1 like
# everywhere else, not a branch ref — an earlier draft of this workflow
# pointed at a feature branch to get a live test run before v1 existed
# with this code; see NOTICE.md for that history and why a mutable
# branch ref here (with real AWS credentials in play) was flagged as its
# own finding by this bot's first live self-review run.
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION are org-level
# GitHub Actions secrets (dogvatar-dog org, Settings > Secrets and
# variables > Actions) — every repo in the org gets them automatically.

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: bedrock-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AWS Bedrock Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: CriticAI Code Review
        uses: dogvatar-dog/CriticAI@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          max-tokens: 3072
