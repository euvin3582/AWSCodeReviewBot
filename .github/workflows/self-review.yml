name: Bedrock Code Review

# Dogfooding: this repo reviews its own PRs with the action it ships,
# the same way every other repo in dogvatar-dog does.
#
# TEMPORARY: pinned to this feature branch (not @v1) so this PR's own
# review run exercises the new Gemini/CodeRabbit-style render_comment()
# and update-in-place code with a real Bedrock call, before the v1 tag
# gets moved to include it. Switch this to `@v1` in the same PR, right
# before merging — see NOTICE.md's "Gemini/CodeRabbit-style comment
# format" entry for why this needed a live check rather than static
# verification alone.
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION are org-level
# GitHub Actions secrets (dogvatar-dog org, Settings > Secrets and
# variables > Actions) — every repo in the org gets them automatically.

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: bedrock-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  review:
    name: AWS Bedrock Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: AWS Bedrock Code Review Action
        uses: dogvatar-dog/AWSCodeReviewBot@feat/gemini-coderabbit-style-fork
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          max-tokens: 3072
